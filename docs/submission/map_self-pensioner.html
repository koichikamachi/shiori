, "istoday": false}, "SELF_BIZ_INDIVIDUAL_SUCCESSION_TAX": {"title": "事業承継税制（個人版）が使えるか確かめる", "status": null, "present": false, "today": "個人で事業をしている場合、事業用の土地・建物・機械を継がせるための税制がある。税理士に、計画の提出（期限 令和10年9月30日）と渡す期限（令和10年12月31日）に間に合うかを確かめる。", "why": "誰に事業を継がせるかを決められるのは本人だけである。", "deadline": "2028-12-31 まで", "days": null, "blocked": [], "unlocks": [], "fact": "計画を出せる期限は令和10年9月30日まで延びましたが、実際に事業用資産を渡す期限は令和10年12月31日で変わっていません。その日までに渡し終えていなければ、この特例は使えません。", "exc": "期限は法改正で動きます。個人版は法人版と期限が違います。いまの期限と要件を、税理士に確かめてください。", "lost": "事業用資産にかかる贈与税・相続税の納税猶予（個人版）", "caution": "【急所】事業用の土地について、この特例と小規模宅地等の特例（特定事業用宅地等）は併用できない。どちらを使うかは、生前に決めておくこと。／計画の提出期限と、実際に渡す期限は別である。法人版とも一年ずれている。", "sb": ["TAX_ACCOUNTANT", "個人版事業承継税制について、個人事業承継計画の提出（期限 令和10年9月30日）と、令和10年12月31日までの承継が可能かを相談したい。小規模宅地等の特例との選択関係もあわせて確認したい。"], "absent": "個人で事業を営んでいないので、個人版の事業承継税制は関係ありません。", "fog": false, "verif": "SOURCE_VERIFIED", "istoday": false}, "SELF_BIZ_SUCCESSION_TAX": {"title": "事業承継税制（法人版）が使えるか、渡す時期まで含めて確かめる", "status": null, "present": false, "today": "顧問税理士に二つを確かめる。①特例承継計画を出せる期限（令和9年9月30日）に間に合うか。②実際に株を渡す期限（令和9年12月31日）までに渡し終えられるか。", "why": "株を誰にいつ渡すかを決められるのは本人だけである。計画を出しても、渡す時期が間に合わなければ意味がない。", "deadline": "2027-12-31 まで", "days": null, "blocked": [], "unlocks": [], "fact": "計画を出せる期限は令和9年9月30日まで延びましたが、実際に株を渡す期限は令和9年12月31日で変わっていません。あいだは3か月しかありません。計画を出しても、その日までに渡し終えていなければ、この特例は使えません。", "exc": "ただし、期限は法改正で動きます。いまの期限と、自社が要件を満たすかを、まず税理士に確かめてください。間に合わない場合にも、一般措置を使う、株価を下げる手立てを取る、役員退職金を組み合わせる、持株会社にして承継の道筋を変えるなどの方法があります。効き方も副作用も違うので、どれが自社に合うかは税理士と決めてください。", "lost": "自社株にかかる贈与税・相続税の納税猶予（特例措置）", "caution": "", "sb": ["TAX_ACCOUNTANT", "事業承継税制（法人版・特例措置）について、①特例承継計画の提出（期限 令和9年9月30日）に間に合うか、②令和9年12月31日までに株の贈与を完了できるか、③間に合わない場合の代替（一般措置、株価対策、役員退職金など）を相談したい。"], "absent": "会社を持っていないので、事業承継税制の期限を気にする必要はありません。", "fog": false, "verif": "SOURCE_VERIFIED", "istoday": false}, "SELF_BIZ_CONTINUITY_KIT": {"title": "自分が倒れた翌日、会社が支払いをできるか", "status": null, "present": false, "today": "代表印の在処、銀行取引の権限を持つ人、後継者の候補を紙に書く。", "why": "権限をどう渡すかは本人しか決められない。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "死んだあとの話より、倒れて判断できなくなったときの話が先に来る。", "sb": ["", ""], "absent": "会社を持っていないので、自分が倒れた翌日の支払いを段取りしておく必要はありません。", "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_BIZ_LOAN_BETWEEN": {"title": "会社と自分のあいだの貸し借り", "status": null, "present": false, "today": "会社に貸しているお金、会社から借りているお金の有無を確かめ、紙に一行書く。", "why": "帳簿にはあるが、家族は見ない。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "会社に貸したお金は本人の財産になり、相続税の対象になり得る。会社から借りたお金は家族の負債になる。", "sb": ["", ""], "absent": "会社を持っていないので、会社と自分のあいだの貸し借りを整理する必要はありません。", "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_FOREIGN_COUNTRY_NOTE": {"title": "海外の資産について、国名と種類だけを書く", "status": null, "present": false, "today": "どの国に、どんな種類の資産（預金・証券・不動産）があるかを紙に書く。金額は要らない。現地に窓口となる人がいれば、その連絡先も書き添える。", "why": "海外資産の最大の危険は税額でも手続の複雑さでもなく、遺族がその存在に気づかないまま終わることである。国名を一行書くだけで、それは防げる。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "", "sb": ["", ""], "absent": "海外に資産がないので、国名と種類を書き残す必要はありません。遺族がその財産の存在に気づかないまま終わる、という一番大きな危険がありません。", "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_FOREIGN_PROBATE_CHECK": {"title": "現地の手続が要る国かどうかを確かめる", "status": null, "present": false, "today": "資産のある国で、亡くなったあとに裁判所の手続（検認）が要るかを確かめる。要るなら、現地の遺言や共同名義など、いま打てる手を相談する。", "why": "現地の遺言を作れるのは本人が生きているあいだだけである。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "国によっては、亡くなった人の財産を動かすのに裁判所の手続が必要で、年単位でかかることがあります。日本の遺言や遺産分割協議書は、そのままでは通らないことがあります。日本の法律は「相続は亡くなった人の本国法による」と定めていますが、これで決まるのは日本側の扱いだけです。不動産については、その土地がある国の法律を適用する国があります。その国では、日本法で相続したという主張が通りません。", "exc": "ただし、生きているあいだにできる手当てがあります。その国の法律に沿った遺言を現地で作っておく。口座や不動産を共同名義にしておく。信託に入れておく。現地で手続を進める弁護士や信託会社を、あらかじめ決めておく。どれも、亡くなったあとでは作れません。国ごとに効き方が違うので、資産のある国それぞれについて、現地の事情を知る専門家に確かめてください。", "lost": "現地の手続を短くする手立て（現地法に沿った遺言、共同名義、信託など）", "caution": "", "sb": ["INTERNATIONAL_TAX_LAWYER", "この国にこの種類の資産がある。現地で検認手続が必要か、必要ならいま打てる手（現地遺言・共同名義・信託など）と、日本の税務との整合を相談したい。"], "absent": "海外に資産がないので、現地の手続が要る国かどうかを調べる必要はありません。", "fog": false, "verif": "SOURCE_VERIFIED", "istoday": false}, "SELF_FOREIGN_REPORT_CHECK": {"title": "国外財産の届出をしているか確かめる", "status": null, "present": false, "today": "一定額を超える国外財産がある場合の毎年の届出について、提出しているかを確かめる。", "why": "", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "提出していない状態は、本人の死後も残る。", "sb": ["", ""], "absent": "海外に資産がないので、国外財産の届出は関係ありません。", "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_HEIR_ESTIMATE": {"title": "いま自分に万一があったら、誰が相続人になるかを書き出す", "status": "READY", "present": true, "today": "配偶者と子を書き出す。前の結婚の子、認知した子、養子も相続人である。子が一人もいなければ親へ、親もいなければ兄弟姉妹へ移る。人数だけでよい。名前はこのアプリに入れない。", "why": "前の結婚の子、認知した子、養子。戸籍を見れば分かることでも、いま思い出せるのは本人だけである。遺族はこれを、戸籍を何通も取り寄せたあとに知る。", "deadline": null, "days": null, "blocked": [], "unlocks": ["自分の戸籍を、生きているうちに取っておく"], "fact": "", "exc": "", "lost": "", "caution": "見落としやすいのは、前の結婚の子、認知した子、養子（普通養子は実の親の相続人でもある）、そして子がいない場合に出てくる親と兄弟姉妹である。籍を入れていない相手は相続人にならない。", "sb": ["JUDICIAL_SCRIVENER", "自分の推定相続人が誰になるかを、戸籍をもとに確かめたい。相続関係説明図の作成を依頼したい。"], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": true}, "SELF_NO_CHILD_ROUTE": {"title": "子がいない場合に効く、ただ一つの手立て", "status": null, "present": false, "today": "遺言を書くと決める。子がいないと、相続人は親、それもいなければ兄弟姉妹（亡くなっていれば甥姪）になる。兄弟姉妹には遺留分がないので、遺言に書いたとおりに渡せる。", "why": "兄弟姉妹の戸籍は、あなたには取れない。だから遺族が集める作業を、あなたが前もって代わることはできない。代わりにできるのが、遺言でその作業自体を要らなくすることである。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "兄弟姉妹の戸籍は、あなたには取れません。市区町村は交付を断れます。だから、あなたが亡くなったあと、遺族は兄弟姉妹（亡くなっていれば甥姪）を戸籍でたどり、その全員から遺産分割の合意を取りつけることになります。人数が多く、面識も薄いのが普通です。", "exc": "ただし、兄弟姉妹には遺留分がありません。遺言を書いておけば、そのとおりに渡せます。話し合い自体が要らなくなります。子がいない方にとって、遺言はここまで効きます。また、親の戸籍はあなたが取れるので、兄弟姉妹が誰かまでは生前に把握できます。ただし兄弟姉妹本人の戸籍は、あなたには請求権がありません。", "lost": "遺産分割の話し合いを、そもそも不要にする道", "caution": "", "sb": ["JUDICIAL_SCRIVENER", "子がいないため、相続人は親または兄弟姉妹になる見込みである。公正証書遺言を作りたい。兄弟姉妹に遺留分がないことを前提に、渡し先の指定と、受け取る人が先に亡くなった場合の予備的な指定も入れたい。"], "absent": "子がいるので、親や兄弟姉妹へ相続が回る経路は通りません。", "fog": false, "verif": "SOURCE_VERIFIED", "istoday": false}, "SELF_KOSEKI_AHEAD": {"title": "自分の戸籍を、生きているうちに取っておく", "status": "NOT_READY", "present": true, "today": "本籍地の役所か、最寄りの役所の広域交付で、自分の生まれてから今までの戸籍（除籍・改製原戸籍を含む）を取り、封筒に入れておく。", "why": "この作業は、あなたなら今日できる。遺族には、あなたが亡くなってからでないとできない。そして遺族の手続は、これが終わるまで八か所で止まる。", "deadline": null, "days": null, "blocked": ["いま自分に万一があったら、誰が相続人になるかを書き出す"], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "取れるのは、自分・配偶者・直系尊属（親、祖父母）・直系卑属（子、孫）の戸籍である。兄弟姉妹の戸籍は取れない。", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_RENOUNCE_CHAIN_WARN": {"title": "渡したい相手が受け取らなかったとき、財産はどこへ行くか", "status": "READY", "present": true, "today": "渡したい相手が相続を放棄する可能性を一度考え、その場合の行き先を遺言で決めておく。", "why": "誰が受け取らないかもしれないかを見当づけられるのは、家族の事情を知っている本人だけである。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "相続を放棄した人は、初めから相続人でなかったことになります。すると財産は、あなたの意思とは関係なく次の順位の人へ移ります。子が全員放棄すれば親へ、親がいなければ兄弟姉妹へ、兄弟姉妹が亡くなっていれば甥姪へ。人数は増え、面識は薄くなります。そして、次に誰へ移るのかがはっきりするのは、遺族が戸籍をたどり終えたあとです。だから、気づくのが手続の終わりがけになることがあります。", "exc": "ただし、遺言で行き先を決めておけば、その指定が生きます。法律は、渡すはずだったものが受け取られなかったときは相続人に帰属すると定めていますが、「遺言者がその遺言に別段の意思を表示したときは、その意思に従う」ともしています。つまり、受け取る人が先に亡くなった場合や受け取らなかった場合にそなえて、予備の行き先を書いておけます。書き方は公証人や専門家に確かめてください。", "lost": "財産の行き先を、自分の意思で決めておく機会", "caution": "", "sb": ["JUDICIAL_SCRIVENER", "渡したい相手が受け取らなかった場合にそなえて、予備の指定を入れた遺言を作りたい。"], "absent": null, "fog": false, "verif": "SOURCE_VERIFIED", "istoday": false}, "SELF_BANK_LIST": {"title": "口座のある金融機関名のメモ", "status": "READY", "present": true, "today": "口座のある銀行・信金・信託・証券会社の名前だけを紙に書く。残高も口座番号も要らない。", "why": "どこに口座があるかを知っているのは本人だけである。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": true}, "SELF_INSURANCE_NOTE": {"title": "生命保険・共済の会社名メモ", "status": "READY", "present": true, "today": "加入している生命保険会社・共済の名前だけを紙に書く。証券番号も金額も要らない。", "why": "銀行は遺族が戸籍を持って窓口で照会できる。しかし保険は、加入している事実を遺族が知らなければ請求されないまま終わる。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": true}, "SELF_DEBT_LEAVE_INSTRUCTION": {"title": "預金に手をつける前に相談してほしい旨を書き残す", "status": null, "present": false, "today": "一覧に添えて、こう書く。『私の預金を引き出して使うと、相続を放棄する道が閉じることがあります。この紙を持って、まず弁護士に相談してください。』", "why": "本人が黙っていると、家族はそれを知らずに閉じる。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "『放棄しなさい』とは書かない。判断は遺族と専門家がする。本人が書くのは、何が起きるかという事実と、相談先である。", "sb": ["", ""], "absent": "借入も保証もないので、預金に手をつける前に相談してほしい旨を書き残す必要はありません。", "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_DEBT_LIST_NOTE": {"title": "借入と保証の一覧", "status": null, "present": false, "today": "借入先と保証先を紙に書く。件数と相手先だけでよい。金額は書かなくてよい。", "why": "借入は通帳や郵便物から辿れるが、保証は主債務者が払っているあいだ何も届かない。本人が書かなければ、誰も知り得ない。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "", "sb": ["", ""], "absent": "借入も保証もないので、その一覧は要りません。", "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_DEBT_INSURANCE_ROUTE": {"title": "放棄されても残る道を用意しておく", "status": null, "present": false, "today": "生命保険の受取人を確かめる。受取人に指定された人は、相続を放棄しても保険金を受け取れるとされている。", "why": "受取人を決められるのは本人だけである。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "受け取れることと、税の扱いは別である。放棄した人には非課税の枠が使えないとされる。ここは税理士に確かめる箇所である。", "sb": ["", ""], "absent": "借入も保証もないので、相続を放棄されても家族に残る道を用意しておく必要はありません。", "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_LAND_ENVELOPE": {"title": "不動産の書類を一つの封筒にまとめる", "status": "READY", "present": true, "today": "固定資産税の納税通知書、公図、権利証（登記識別情報）を一つの封筒に入れる。", "why": "どこにしまったかを知っているのは本人だけである。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_LAND_ANCESTOR_TITLE": {"title": "先代の名義のまま残っている土地がないか確かめる", "status": null, "present": false, "today": "名寄帳と登記簿で、祖父や父の名義のままの土地がないかを確かめる。", "why": "経緯を知っているのは本人である。本人が死ねば、家族は二世代分の相続人を探すことになる。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "先代名義のまま残っていると、家族は本人の相続だけでなく先代の相続まで遡って相続人を探すことになる。人数が一気に増え、話し合いがまとまらなくなる。", "sb": ["JUDICIAL_SCRIVENER", "先代名義のまま残っている土地がある。相続人の調査と、いま名義を整理しておく場合の手順と費用を相談したい。"], "absent": "自宅以外の土地がないので、先代の名義のまま残っていないかを調べる必要はありません。放っておくと相続人が何十人にもなる場所なので、ここが消えるのは大きいです。", "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_LAND_BOUNDARY": {"title": "隣との境界が決まっているかを確かめる", "status": null, "present": false, "today": "境界標があるか、確定測量図があるかを確かめる。なければ、隣家と話せるうちに手を打つ。", "why": "本人が生きているうちなら、隣家とはまだ話ができる。本人の死後は、家族と隣家が初めて向き合うことになる。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "", "sb": ["LAND_SURVEYOR", "境界が確定していない土地がある。確定測量または筆界特定の手続と、費用と期間を相談したい。"], "absent": "自宅以外の土地がないので、隣との境界を確かめる作業は要りません。", "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_HOME_TITLE_CHECK": {"title": "自宅の名義を確かめる", "status": "READY", "present": true, "today": "登記簿で自宅の名義人を確かめる。亡くなった親や祖父の名義のままになっていないかを見る。", "why": "権利証や過去の経緯を知っているのは本人である。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "相続による名義変更には申請の義務と期限があり、怠ると過料の対象になるとされる。財産の多い少ないとは関係なく、持ち家のある人すべてに関わる。", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_LAND_LEASE_NOTE": {"title": "貸している土地・借りている土地の一覧", "status": null, "present": false, "today": "誰に何を貸しているか、契約書がどこにあるかを紙に書く。金額は要らない。", "why": "口約束や古い経緯を知っているのは本人だけである。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": 予定も、籍を入れていない相手もないので、遺言を実行する人を決めておく必要はありません。", "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_TAX_BOUNDARY": {"title": "相続税の申告が要るかどうかの境界を見る", "status": "READY", "present": true, "today": "家族の人数から基礎控除の枠を出し、財産の合計がそれを超えそうかどうかだけを見る。金額は概算でよい。", "why": "", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "控除の範囲に収まるなら、家族は申告そのものが要らない。それが分かるだけで心配が一つ消える。", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_TAX_MAGNITUDE": {"title": "納税額の桁を見当づける", "status": null, "present": false, "today": "自宅と預貯金のおおまかな合計から、納税が数百万円の話か、それ以上かの見当をつける。", "why": "", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "", "sb": ["", ""], "absent": "財産が基礎控除を超えない見込みなので、納税額の桁を見当づける必要はありません。", "fog": true, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_CASH_FOR_TAX": {"title": "納税と当面の資金を、現金でどう用意するか", "status": null, "present": false, "today": "財産が不動産や自社株に偏っていないかを見る。偏っているなら、生命保険の活用など現金を用意する手立てを検討する。", "why": "", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "家は売れないのに税だけ来る、ということが起こり得る。", "sb": ["TAX_ACCOUNTANT", "財産が不動産・自社株に偏っており納税資金が不足する懸念がある。生命保険の非課税枠の活用を含め、現金を用意する手立てを相談したい。"], "absent": "相続税がかからない見込みなので、納税のための現金を用意する話は要りません。", "fog": true, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_TAX_PREP_ENVELOPE": {"title": "税理士に相談するための書類を一つの封筒にまとめる", "status": null, "present": false, "today": "固定資産税の納税通知書と、金融機関のメモを一つの封筒に入れる。", "why": "", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "", "sb": ["TAX_ACCOUNTANT", "基礎控除を超える見込みがある。固定資産税納税通知書を持参するので、小規模宅地等の特例が使えるかどうかと、概算の試算をお願いしたい。"], "absent": "相続税の申告が要らない見込みなので、税理士に渡す書類をまとめる必要はありません。", "fog": true, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_LAND_SMALL_RESIDENTIAL": {"title": "自宅の土地の評価を下げられる特例が使えるか、先に確かめる", "status": null, "present": false, "today": "誰 : {"title": "スマホの開け方と、契約中のサービス名のメモ", "status": "READY", "present": true, "today": "スマートフォンのロックを解く手順と、毎月払っている定期サービスの名前を紙に書く。", "why": "本人以外に、契約の全体を知っている人がいない。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_INCAPACITY_PLAN": {"title": "判断ができなくなったときの、生活費の出し方", "status": "READY", "present": true, "today": "自分が入院や認知症で動けなくなったとき、誰がどうやって生活費を引き出すのかを決めておく。", "why": "本人が元気なうちにしか決められない。判断ができなくなってからでは、選べる手立てが限られる。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "死んだあとの話より、こちらが先に来ることがある。", "sb": ["LAWYER", "判断能力が低下した場合に備え、任意後見・財産管理委任・家族信託のどれが自分の事情に合うかを相談したい。"], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_DESIGNATE_OPERATOR": {"title": "死後の事務を実際に担う人を決めておく", "status": "READY", "present": true, "today": "届出・葬儀・片付けを実際に動いてくれる人と、事前に話をしておく。相続人であるとは限らない。", "why": "誰に頼むかは本人しか決められない。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SELF_WISHES_EFFECTIVE_OR_NOT": {"title": "効く希望と、効かない希望の書き分け", "status": "READY", "present": true, "today": "葬儀のやり方、遺骨、ペットの引き取り先などの希望を書き出し、どれが法的に効き、どれが効かないかを確かめる。", "why": "希望そのものは本人にしか出せない。", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "効かないから無駄なのではない。効き方が違う。遺言に書くのか、付言に添えるのか、別の契約にするのかが変わる。", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}};</script><div class="wrap" style="padding-top:0"><footer>これは、手続の順序と期限を示す地図です。個別の法律相談や税務相談ではありません。あなたの場合にどうなるかは、記載の相談先で確かめてください。制度は変わります。多くの項目は、まだ専門家の確認を受けていません。</footer></div><script>
const P=document.getElementById('panel');
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const SB={LAWYER:'弁護士',JUDICIAL_SCRIVENER:'司法書士',TAX_ACCOUNTANT:'税理士',
 ADMINISTRATIVE_SCRIVENER:'行政書士',LAND_SURVEYOR:'土地家屋調査士',
 INTERNATIONAL_LAWYER:'海外の弁護士',INTERNATIONAL_TAX_LAWYER:'国際税務の専門家'};
const ST={DONE:'済んだ',READY:'手をつけられる',IN_PROGRESS:'着手している',
 WAITING:'相手の返事を待っている',NOT_READY:'まだ開かない'};
function show(id){
  const d=D[id];if(!d)return;let h='<h2>'+esc(d.title)+'</h2>';
  h+='<span class="tag">'+esc(d.present?(ST[d.status]||d.status):(d.fog?'まだ分からない':'通らない道'))+'</span>';
  if(d.istoday)h+='<span class="tag" style="background:#fdece4;color:#c2410c">今日決めること</span>';
  if(d.verif)h+='<span class="tag">'+esc(d.verif)+'</span>';
  if(!d.present){h+='<div class="note">'+esc(d.absent||'')+'</div>';P.innerHTML=h;return;}
  if(d.fact)h+='<div class="band"><b>【事実】</b> '+esc(d.fact)+'<br><br><b>【ただし】</b> '+esc(d.exc)
    +(d.lost?'<br><br><span style="font-size:11.5px;color:#7a7364">失われるもの … '+esc(d.lost)+'</span>':'')+'</div>';
  h+='<dl>';
  h+='<dt>やること</dt><dd>'+esc(d.today)+'</dd>';
  if(d.deadline)h+='<dt>期限</dt><dd>'+esc(d.deadline)+(d.days!=null?'（あと '+d.days+' 日）':'')+'</dd>';
  if(d.blocked&&d.blocked.length)h+='<dt>いま止まっている理由</dt><dd>「'+d.blocked.map(esc).join('」「')+'」が終わっていません</dd>';
  if(d.unlocks&&d.unlocks.length)h+='<dt>ここが済むと開きます</dt><dd>'+d.unlocks.map(esc).join('、')+'</dd>';
  if(d.why)h+='<dt>あなたにしかできない理由</dt><dd>'+esc(d.why)+'</dd>';
  if(d.sb[0])h+='<dt>相談するなら</dt><dd>'+esc(SB[d.sb[0]]||d.sb[0])+'<br>'+esc(d.sb[1])+'</dd>';
  h+='</dl>';
  if(d.caution)h+='<div class="note">※ '+esc(d.caution)+'</div>';
  P.innerHTML=h;
}
document.querySelectorAll('.st').forEach(g=>{
  g.addEventListener('click',()=>show(g.dataset.id));
  g.addEventListener('keydown',e=>{if(e.key==='Enter')show(g.dataset.id);});
});
</script></body></html>
