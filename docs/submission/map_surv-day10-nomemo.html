-8" fill="none" stroke="#fff" stroke-width="2.4"/><text x="160" y="759" text-anchor="middle" class="stt">死亡届と火葬許可の申請</text><text x="160" y="705" text-anchor="middle" class="dl">3日超過</text></g><g class="st done" data-id="SURV_KNOW_SAFE_ACTIONS" tabindex="0"><circle cx="160" cy="802" r="15" fill="#4a7c59" stroke="#4a7c59" stroke-width="2.6"/><path d="M154,802 l4,4 l8,-8" fill="none" stroke="#fff" stroke-width="2.4"/><text x="160" y="833" text-anchor="middle" class="stt">やってよいことと、慎重に…</text></g><g class="st done" data-id="SURV_FUNERAL_ARRANGEMENT" tabindex="0"><circle cx="160" cy="876" r="15" fill="#4a7c59" stroke="#4a7c59" stroke-width="2.6"/><path d="M154,876 l4,4 l8,-8" fill="none" stroke="#fff" stroke-width="2.4"/><text x="160" y="907" text-anchor="middle" class="stt">葬儀の手配と、費用の出し…</text></g><g class="st done" data-id="SURV_FIND_ENTRY" tabindex="0"><circle cx="160" cy="950" r="15" fill="#4a7c59" stroke="#4a7c59" stroke-width="2.6"/><path d="M154,950 l4,4 l8,-8" fill="none" stroke="#fff" stroke-width="2.4"/><text x="160" y="981" text-anchor="middle" class="stt">本人が残した入口（紙・封…</text></g><g class="st today" data-id="SURV_PENSION_AND_BENEFITS" tabindex="0"><circle cx="410" cy="728" r="15" fill="#c2410c" stroke="#c2410c" stroke-width="2.6"/><text x="410" y="759" text-anchor="middle" class="stt">年金の停止と、請求しない…</text></g><g class="st ready" data-id="SURV_DIGITAL_CLEANUP" tabindex="0"><circle cx="410" cy="802" r="15" fill="#fff" stroke="#1f4e79" stroke-width="2.6"/><text x="410" y="833" text-anchor="middle" class="stt">携帯と定期サービスの解約</text></g><g class="st gone" data-id="SURV_FIND_KEY_HOLDER" tabindex="0"><circle cx="160" cy="1038" r="15" fill="#d9d5cc" stroke="#d9d5cc" stroke-width="2.6"/><text x="160" y="1069" text-anchor="middle" class="stt">入口を開ける手立てを預か…</text></g><g class="st gone" data-id="SURV_NON_HEIR_SCOPE" tabindex="0"><circle cx="360" cy="1038" r="15" fill="#d9d5cc" stroke="#d9d5cc" stroke-width="2.6"/><text x="360" y="1069" text-anchor="middle" class="stt">相続人でない私が、できる…</text></g><g class="st gone" data-id="SURV_FOREIGN_PROBATE_START" tabindex="0"><circle cx="160" cy="1222" r="15" fill="#d9d5cc" stroke="#d9d5cc" stroke-width="2.6"/><text x="160" y="1253" text-anchor="middle" class="stt">海外の資産について、現地…</text></g></svg></div><aside id="panel"><p class="hint">駅をクリックすると、その手続の中身が出ます。</p></aside></div><script>const D={"SURV_FOREIGN_PROBATE_START": {"title": "海外の資産について、現地の手続を始める", "status": null, "present": false, "today": "国別のメモをもとに、現地で裁判所の手続が必要かを確かめ、必要なら現地の専門家に依頼する。", "why": "", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "日本の戸籍や遺産分割協議書は、そのままでは通らない。翻訳と公証が必要になる。", "sb": ["INTERNATIONAL_LAWYER", "この国にこの資産がある。日本の戸籍・遺言の翻訳と公証、および現地の手続の代行をお願いしたい。"], "absent": "海外に資産がないので、現地の手続は要りません。", "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SURV_WARN_DEPOSIT": {"title": "故人の預金に触る前に知っておくこと", "status": "READY", "present": true, "today": "借入や保証の有無が分かるまで、故人の口座から引き出して使わない方針を決める。葬儀費用の出し方も、この方針のなかで決める。", "why": "", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "故人の預金を引き出して使うと、法律上すべてを相続したとみなされることがあります。そうなると、あとから多額の借金や保証が判明しても、放棄できません。", "exc": "ただし、葬儀費用などのために、一定の範囲で払い戻しを受けられる仕組みがあります。上限があります。使う前にその範囲を確かめてください。そして、領収書を必ず保管し、金額は一般的な範囲にとどめてください。", "lost": "相続を放棄する、または限定して承認する権利", "caution": "", "sb": ["LAWYER", "葬儀費用を故人の口座から支払うことが単純承認にあたらないか、遺産分割前の払戻し制度の範囲とあわせて相談したい。"], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SURV_RANK_SHIFT_NOTICE": {"title": "先順位の人が放棄すると、あなたが相続人になります", "status": "READY", "present": true, "today": "自分より先の順位の人（子、親）が相続を放棄していないかを確かめる。次順位の相続人は利害関係人にあたるため、家庭裁判所に相続放棄の申述の有無を照会できる。", "why": "", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "先順位の人が全員放棄すると、あなたが相続人になります。家庭裁判所は、そのことをあなたに知らせません。負債も一緒に来ます。気づかないまま期間が過ぎると、そのまま引き継ぐことになります。", "exc": "ただし、あなたの3か月は、亡くなった日からではなく、あなたが相続人になったことを知った時から始まります。死後何か月経っていても、知ったばかりなら、まだ間に合います。", "lost": "相続を放棄する、または限定して承認する権利", "caution": "", "sb": ["LAWYER", "先順位の相続人が放棄したため、自分が相続人になったかもしれない。放棄の申述の有無を照会したい。熟慮期間の起算点と、放棄の手続を相談したい。"], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SURV_DECIDE_ACCEPT_OR_RENOUNCE": {"title": "相続するか、放棄するか、限定して承認するかを決める", "status": "NOT_READY", "present": true, "today": "財産と負債を見比べ、負債が上回るなら家庭裁判所へ放棄または限定承認を申し述べる。調べが終わらないなら、先に期間の伸長を申し立てる。", "why": "", "deadline": "自己のために相続の開始があったことを知った時から 3 か月", "days": 82, "blocked": ["相続人を確定する", "財産と負債の一覧を作る"], "unlocks": ["自分が放棄するなら、次に相続人になる人に自分から伝える", "財産の分け方を話し合い、合意書を作る"], "fact": "この期間を過ぎると、原則として、借入や保証をそのまま引き継ぐことになります。", "exc": "ただし、借金の存在をまったく知らなかった場合（督促状が届いて初めて知った場合など）には、期間の数え始めが後ろにずれると判断された例があります。期限を過ぎたと思っても、あきらめる前に弁護士に相談してください。", "lost": "相続を放棄する、または限定して承認する権利", "caution": "知らなかった借金や保証があとから出てきたときは、この判断をやり直す余地がある。熟慮期間の起算点を、借金を知った時とする扱いがある。まず弁護士に相談すること。", "sb": ["LAWYER", "故人に借入または保証がある可能性がある。放棄または限定承認の手続、あるいは調査が終わらない場合の期間の伸長の申立てをお願いしたい。"], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SURV_TAX_FILING": {"title": "相続税の申告と納付", "status": null, "present": false, "today": "税理士に依頼するか自分で申告する。納付は原則として一括・現金である（延納や物納もあるが、要件が極めて厳しい）。", "why": "", "deadline": "相続の開始があったことを知った日の翌日からから 10 か月", "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "分け方が決まっていなくても、期限は来る。決まっていない場合は、法定相続分で分けたものとみなして申告・納税する。ただし未分割のままだと、配偶者の税額軽減も小規模宅地等の特例も使えず、税額が跳ね上がる。あとからこれらを使うために、申告書と一緒に「申告期限後3年以内の分割見込書」を必ず出しておくこと。", "sb": ["TAX_ACCOUNTANT", "相続税の申告を依頼したい。期限までに分割がまとまらない場合は、未分割で申告したうえで「申告期限後3年以内の分割見込書」を出したい。納税資金の用意についても相談したい。"], "absent": "財産が基礎控除を超えないので、相続税の申告と納付は要りません。", "fog": true, "verif": "SELF_REVIEWED", "istoday": false}, "SURV_DISCOVER_DEBT": {"title": "借入と保証を調べる", "status": "READY", "present": true, "today": "信用情報機関へ開示を請求し、郵便物も確かめる。あわせて、故人が事業をしていた場合は保証の有無を金融機関に確かめる。", "why": "", "deadline": null, "days": null, "blocked": [], "unlocks": ["財産と負債の一覧を作る"], "fact": "", "exc": "", "lost": "", "caution": "信用情報の開示では、保証債務が出てこないことがある。主債務者が払っているあいだは、何も届かない。ここは調べても分からないことがある、と知っておくこと。", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": true}, "SURV_INCOME_TAX_FINAL": {"title": "故人の所得税の申告", "status": null, "present": false, "today": "準確定申告が要るかどうかは、故人が生きていれば、その年の所得税の確定申告をしなければならなかったかで決まる。手がかりは、事業や不動産の収入、給与2,000万円超、公的年金400万円超、給与や年金以外の所得20万円超、年内の不動産の売却など。当てはまりそうなら税理士に確かめ、必要なら亡くなった年の分を申告する。", "why": "", "deadline": "相続の開始があったことを知った日の翌日からから 4 か月", "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "原則は相続人全員の連名で出す。しかし相続人の確定を待っていると4か月に間に合わないことがある。その場合は、各相続人が単独で出すことができる。単独で出した人は、申告した内容を他の相続人に知らせる義務を負う。なお、入院や治療の費用が多かった場合の医療費控除など、還付になることもある。還付の申告に4か月の縛りはなく、5年間できる。", "sb": ["TAX_ACCOUNTANT", "故人に申告の要る所得があったか、準確定申告が必要かを確かめ、必要なら依頼したい。"], "absent": "故人に申告の要る所得がなかったので、所得税の申告は要りません。", "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SURV_CLAIM_INSURANCE": {"title": "生命保険金の請求", "status": "READY", "present": true, "today": "保険会社へ連絡し、死亡保険金を請求する。相続を放棄する場合でも、受取人に指定された人は受け取れるとされている。", "why": "", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "受け取れることと、税の扱いは別である。税の扱いは税理士に確かめる箇所である。", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SURV_RENOUNCE_TELL_NEXT": {"title": "自分が放棄するなら、次に相続人になる人に自分から伝える", "status": "NOT_READY", "present": true, "today": "放棄すると決めたら、次の順位になる人（親、兄弟姉妹、甥姪）に、放棄したこと、負債があるかもしれないこと、その人の3か月がそこから始まることを伝える。", "why": "", "deadline": null, "days": null, "blocked": ["相続するか、放棄するか、限定して承認するかを決める"], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "裁判所は次順位の人に通知しない。伝えないと、その人は何も知らないまま期間を過ぎることがある。負債があるときは、伝えないことがそのまま損害になる。", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SURV_FIND_WILL": {"title": "遺言があるかどうかを調べる", "status": "READY", "present": true, "today": "自宅を探すだけでなく、法務局の保管制度と公証役場の検索を使って、遺言が預けられていないかを調べる。", "why": "", "deadline": null, "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "先に調べておけば、話し合いが終わったあとに遺言が出てくるという事態を防げる。自宅で見つけた自筆の遺言は、開ける前に手続が必要な場合がある。", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SURV_COLLECT_KOSEKI": {"title": "生まれてから亡くなるまでの戸籍を集める", "status": "READY", "present": true, "today": "市区町村の窓口で、故人の戸籍を切れ目なく請求する。まず広域交付が使えるかを窓口で確かめる。", "why": "", "deadline": null, "days": null, "blocked": [], "unlocks": ["相続人を確定する"], "fact": "", "exc": "", "lost": "", "caution": "これが終わるまで、財産の分け方の話し合いは進められない。ただし、待っているあいだに進められることは他にある。", "sb": ["JUDICIAL_SCRIVENER", "故人の本籍の移動が多く戸籍の追跡が難しい。戸籍の収集と相続関係説明図の作成をお願いしたい。"], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SURV_DETERMINE_HEIRS": {"title": "相続人を確定する", "status": "NOT_READY", "present": true, "today": "集めた戸籍をもとに相続関係の図を作り、相続人を全員確定させる。", "why": "", "deadline": null, "days": null, "blocked": ["生まれてから亡くなるまでの戸籍を集める"], "unlocks": ["他の相続人・関係者に伝える", "相続するか、放棄するか、限定して承認するかを決める", "相続税の申告が要るかどうかを判定する", "財産の分け方を話し合い、合意書を作る"], "fact": "", "exc": "", "lost": "", "caution": "相続人は、一度決めても入れ替わります。誰かが放棄すると、その人は初めから相続人でなかったことになり、次の順位の人へ移ります。子が全員放棄すれば親へ、親がいなければ兄弟姉妹へ、兄弟姉妹が亡くなっていれば甥姪へ。人数は増え、面識は薄くなります。", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SURV_HEIR_DECLARATION_REG": {"title": "分け方が決まらないうちに、相続人であることだけ申し出ておく", "status": null, "present": false, "today": "遺産分割がまとまらないうちでも、自分ひとりで法務局へ「相続人申告登記」を申し出ておく。戸籍で相続人であることを示せば足りる。", "why": "", "deadline": "自己のために相続の開始があったことを知り、かつ所有権を取得したことを知った日から 36 か月", "days": null, "blocked": [], "unlocks": [], "fact": "相続登記の申請には義務があります。分け方が決まらないまま3年が過ぎると、10万円以下の過料の対象になります。話し合いが長引いていることは、言い訳になりません。", "exc": "ただし、分け方が決まっていなくても、自分ひとりで「相続人である」と申し出ておけば、その人については義務を果たしたものとして扱われます。他の相続人の同意は要りません。", "lost": "過料を科されずに、分割の話し合いを続ける道", "caution": "これは所有権の移転登記ではない。遺産分割が成立したら、その日から3年以内に、あらためて相続登記を申請する義務が生じる。", "sb": ["JUDICIAL_SCRIVENER", "遺産分割がまとまらないため、相続人申告登記を出しておきたい。必要な戸籍の範囲と費用を知りたい。"], "absent": "遺産に不動産がないか、遺言があるので、この申し出は要りません。遺言があれば、分割の話し合いを待たずに名義を変えられます。", "fog": false, "verif": "SOURCE_VERIFIED", "istoday": false}, "SURV_DISCOVER_ACCOUNTS": {"title": "取引のあった金融機関を探す（標準の経路）", "status": "READY", "present": true, "today": "自宅の通帳・郵便物・キャッシュカードを確かめ、取引のあった金融機関を特定して残高証明を請求する。", "why": "", "deadline": null, "days": null, "blocked": [], "unlocks": ["財産と負債の一覧を作る"], "fact": "", "exc": "", "lost": "", "caution": "", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SURV_REGISTRATION_BY_WILL": {"title": "不動産の名義変更（遺言にもとづく）", "status": null, "present": false, "today": "遺言の内容にしたがって、法務局へ名義変更を申請する。遺言執行者がいる場合は、その人が手続を進められる。", "why": "", "deadline": "自己のために相続の開始があったことを知り、かつ所有権を取得したことを知った日から 36 か月", "days": null, "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "相続登記の申請には義務があり、怠ると10万円以下の過料の対象になる。遺言があるときは、遺産分割の話し合いを待つ必要がない。", "sb": ["JUDICIAL_SCRIVENER", "遺言にもとづく不動産の名義変更を依頼したい。必要な書類の範囲と費用、遺言執行者の有無による違いを知りたい。"], "absent": "遺産に不動産がないか、遺言がないので、この道は通りません。", "fog": false, "verif": "SOURCE_VERIFIED", "istoday": false}, "SURV_LIST_ASSETS": {"title": "財産と負債の一覧を作る", "status": "NOT_READY", "present": true, "today": "残高証明、固定資産税の課税明細、名寄帳、借入の開示結果をもとに、財産と負債の一覧にまとめる。", "why": "", "deadline": null, "days": null, "blocked": ["取引のあった金融機関を探す（標準の経路）", "借入と保証を調べる"], "unlocks": ["相続するか、放棄するか、限定して承認するかを決める", "相続税の申告が要るかどうかを判定する", "財産の分け方を話し合い、合意書を作る"], "fact": "", "exc": "", "lost": "", "caution": "", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": false}, "SURV_ESTATE_DIVISION": {"title": "財産の分け方を話し合い、合意書を作る", "status": "NOT_READY", "present": true, "today": "確定した相続人全員で、財産の一覧をもとに分け方を合意し、署名押印する。", "why": "", "deadline": null, "days": null, "blocked": ["相続人を確定する", "財産と負債の一覧を作る", "相続するか、放棄するか、限定して承認するかを決める"], "unlocks": [], "fact": "全員が署名押印して成立した合意は、原則としてあとから撤回できません。", "exc": "ただし、相続人全員が改めて合意すれば、やり直せる場合があります。ただし、やり直した時期によって税の扱いが変わります。相続税の申告期限を過ぎてからのやり直しは、財産の移し替えが贈与にあたるとして、別に贈与税がかかると判断された例があります。やり直す前に、必ず税理士に確かめてください。", "lost": "分け方をやり直す機会", "caution": "やり直しを考えるときは、司法書士だけでなく税理士にも確かめること。登記はやり直せても、税は戻らないことがある。" 律相談や税務相談ではありません。あなたの場合にどうなるかは、記載の相談先で確かめてください。制度は変わります。多くの項目は、まだ専門家の確認を受けていません。</footer></div><script>
const P=document.getElementById('panel');
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const SB={LAWYER:'弁護士',JUDICIAL_SCRIVENER:'司法書士',TAX_ACCOUNTANT:'税理士',
 ADMINISTRATIVE_SCRIVENER:'行政書士',LAND_SURVEYOR:'土地家屋調査士',
 INTERNATIONAL_LAWYER:'海外の弁護士',INTERNATIONAL_TAX_LAWYER:'国際税務の専門家'};
const ST={DONE:'済んだ',READY:'手をつけられる',IN_PROGRESS:'着手している',
 WAITING:'相手の返事を待っている',NOT_READY:'まだ開かない'};
function show(id){
  const d=D[id];if(!d)return;let h='<h2>'+esc(d.title)+'</h2>';
  h+='<span class="tag">'+esc(d.present?(ST[d.status]||d.status):(d.fog?'まだ分からない':'通らない道'))+'</span>';
  if(d.istoday)h+='<span class="tag" style="background:#fdece4;color:#c2410c">今日決めること</span>';
  if(d.verif)h+='<span class="tag">'+esc(d.verif)+'</span>';
  if(!d.present){h+='<div class="note">'+esc(d.absent||'')+'</div>';P.innerHTML=h;return;}
  if(d.fact)h+='<div class="band"><b>【事実】</b> '+esc(d.fact)+'<br><br><b>【ただし】</b> '+esc(d.exc)
    +(d.lost?'<br><br><span style="font-size:11.5px;color:#7a7364">失われるもの … '+esc(d.lost)+'</span>':'')+'</div>';
  h+='<dl>';
  h+='<dt>やること</dt><dd>'+esc(d.today)+'</dd>';
  if(d.deadline)h+='<dt>期限</dt><dd>'+esc(d.deadline)+(d.days!=null?'（あと '+d.days+' 日）':'')+'</dd>';
  if(d.blocked&&d.blocked.length)h+='<dt>いま止まっている理由</dt><dd>「'+d.blocked.map(esc).join('」「')+'」が終わっていません</dd>';
  if(d.unlocks&&d.unlocks.length)h+='<dt>ここが済むと開きます</dt><dd>'+d.unlocks.map(esc).join('、')+'</dd>';
  if(d.why)h+='<dt>あなたにしかできない理由</dt><dd>'+esc(d.why)+'</dd>';
  if(d.sb[0])h+='<dt>相談するなら</dt><dd>'+esc(SB[d.sb[0]]||d.sb[0])+'<br>'+esc(d.sb[1])+'</dd>';
  h+='</dl>';
  if(d.caution)h+='<div class="note">※ '+esc(d.caution)+'</div>';
  P.innerHTML=h;
}
document.querySelectorAll('.st').forEach(g=>{

});
