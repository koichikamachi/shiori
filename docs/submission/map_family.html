<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>しおり／地図 — 家族・親のことが気になっているが、切り出せない</title><style>

</style></head><body><div class="wrap"><div class="head"><h1>家族・親のことが気になっているが、切り出せない</h1><p class="meta">family　／　2026-09-04 時点</p><div class="counts"><b>5</b> 件が、あなたの道です<span class="sep">／</span>済んだ <b>0</b> 件<span class="sep">／</span>通らない道 <b>0</b> 件<span class="sep">／</span>ぜんぶで 5 件</div><div class="bar"><i style="width:0%"></i></div></div><div class="legend"><span><i class="k done"></i>済んだ</span><span><i class="k today"></i>今日決める（三件を超えません）</span><span><i class="k ready"></i>手をつけられる</span><span><i class="k notready"></i>まだ開かない</span><span><i class="k warnk"></i>通り過ぎると戻れない</span><span><i class="k closedk"></i>もう申し立てられない期間</span><span><i class="k resetk"></i>出来事で戻る</span><span class="axis">← 左が先、右があと。左が済むと、右が開きます</span></div><div class="board"><svg viewBox="0 0 762 352" width="762" role="img" aria-label="手続の路線図"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b9b3a7"/></marker><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b3261e"/></marker></defs><text x="160" y="42" text-anchor="middle" class="col">1　はじめに</text><line x1="160" y1="50" x2="160" y2="342" stroke="#eae6dc" stroke-width="1"/><text x="396" y="42" text-anchor="middle" class="col">2　これが済んでから</text><line x1="396" y1="50" x2="396" y2="342" stroke="#eae6dc" stroke-width="1"/><text x="632" y="42" text-anchor="middle" class="col">3　そのあと</text><line x1="632" y1="50" x2="632" y2="342" stroke="#eae6dc" stroke-width="1"/><rect x="26" y="98" width="718" height="222" rx="12" fill="#f4f1ea"/><text x="40" y="122" class="lane">家族に切り出す　<tspan class="lanesub">5 件</tspan></text><path d="M176,172 C278.0,172 278.0,172 371,172" fill="none" stroke="#b9b3a7" stroke-width="2" marker-end="url(#ar)"/><path d="M412,172 C514.0,172 514.0,172 607,172" fill="none" stroke="#b9b3a7" stroke-width="2" marker-end="url(#ar)"/><path d="M412,172 C514.0,172 514.0,260 607,260" fill="none" stroke="#b9b3a7" stroke-width="2" marker-end="url(#ar)"/><g class="st today" data-id="FAMILY_NARROW_WHAT_TO_ASK" tabindex="0" role="button"><circle cx="160" cy="172" r="16" fill="#c2410c" stroke="#c2410c" stroke-width="2.8"/><text x="160" y="177" text-anchor="middle" class="num">1</text><text x="160" y="204" text-anchor="middle" class="stt">親にしか答えられないことだ</text><text x="160" y="219" text-anchor="middle" class="stt">けに絞る</text></g><g class="st today" data-id="FAMILY_RESEARCH_WITHOUT_PARENT" tabindex="0" role="button"><circle cx="160" cy="260" r="16" fill="#c2410c" stroke="#c2410c" stroke-width="2.8"/><text x="160" y="265" text-anchor="middle" class="num">2</text><text x="160" y="292" text-anchor="middle" class="stt">親が話してくれなくても、自</text><text x="160" y="307" text-anchor="middle" class="stt">分で調べられること</text></g><g class="st notready" data-id="FAMILY_ASK_DOC_LOCATION" tabindex="0" role="button"><circle cx="396" cy="172" r="16" fill="#ffffff" stroke="#b9b3a7" stroke-width="2.8"/><text x="396" y="204" text-anchor="middle" class="stt">書類の置き場所だけを聞く言</text><text x="396" y="219" text-anchor="middle" class="stt">い方</text></g><g class="st notready" data-id="FAMILY_SUGGEST_ENTRY_AND_KEY" tabindex="0" role="button"><circle cx="632" cy="172" r="16" fill="#ffffff" stroke="#b9b3a7" stroke-width="2.8"/><text x="632" y="204" text-anchor="middle" class="stt">親に、入口と鍵の渡し方を伝</text><text x="632" y="219" text-anchor="middle" class="stt">える</text></g><g class="st notready" data-id="FAMILY_PARENT_INCAPACITY_PREP" tabindex="0" role="button"><circle cx="632" cy="260" r="16" fill="#ffffff" stroke="#b9b3a7" stroke-width="2.8"/><text x="632" y="292" text-anchor="middle" class="stt">親が判断できなくなったとき</text><text x="632" y="307" text-anchor="middle" class="stt">の備えを、先に話す</text></g></svg></div></div><aside id="panel" class="closed"><button id="x" aria-label="閉じる">×</button><div id="body"></div></aside><script>const D={"FAMILY_NARROW_WHAT_TO_ASK": {"title": "親にしか答えられないことだけに絞る", "status": "READY", "present": true, "today": "聞きたいことを全部書き出し、そのうち『親にしか答えられないこと』だけに印をつける。残りは自分で調べられる。", "why": "", "deadline": null, "days": null, "dlsrc": "", "dlurl": "", "dlat": "", "blocked": [], "unlocks": ["書類の置き場所だけを聞く言い方"], "fact": "", "exc": "", "lost": "", "caution": "聞くべきことは、思っているよりずっと少ない。全部を聞き出す必要はない。", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": 1, "closed": false, "assumed": false, "closednote": "", "stream": "家族に切り出す"}, "FAMILY_ASK_DOC_LOCATION": {"title": "書類の置き場所だけを聞く言い方", "status": "NOT_READY", "present": true, "today": "『相続の話をしたい』ではなく、こう言う。『万一のときに困らないよう、保険証券や通帳がどの引き出しにあるかだけ教えておいてほしい。』", "why": "", "deadline": null, "days": null, "dlsrc": "", "dlurl": "", "dlat": "", "blocked": ["親にしか答えられないことだけに絞る"], "unlocks": ["親が判断できなくなったときの備えを、先に話す", "親に、入口と鍵の渡し方を伝える"], "fact": "", "exc": "", "lost": "", "caution": "財産の話ではなく、置き場所の話にする。親は答えやすくなる。", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": 0, "closed": false, "assumed": false, "closednote": "", "stream": "家族に切り出す"}, "FAMILY_RESEARCH_WITHOUT_PARENT": {"title": "親が話してくれなくても、自分で調べられること", "status": "READY", "present": true, "today": "親の協力なしに分かることを確かめる。自宅の名義（登記簿は誰でも取れる）、実家の固定資産税の課税明細が届いているか、兄弟の人数と連絡先の整理。", "why": "", "deadline": null, "days": null, "dlsrc": "", "dlurl": "", "dlat": "", "blocked": [], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "何もできずに待つしかない、というわけではない。親の協力を前提にしない道がある。", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": 2, "closed": false, "assumed": false, "closednote": "", "stream": "家族に切り出す"}, "FAMILY_SUGGEST_ENTRY_AND_KEY": {"title": "親に、入口と鍵の渡し方を伝える", "status": "NOT_READY", "present": true, "today": "『中身は見せなくていい。どこを見ればいいかだけ、どこかに書いておいてほしい』と伝える。", "why": "", "deadline": null, "days": null, "dlsrc": "", "dlurl": "", "dlat": "", "blocked": ["書類の置き場所だけを聞く言い方"], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "中身を見せろと言えば警戒される。入口だけを求めれば、親の側の抵抗はずっと小さい。", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": 0, "closed": false, "assumed": false, "closednote": "", "stream": "家族に切り出す"}, "FAMILY_PARENT_INCAPACITY_PREP": {"title": "親が判断できなくなったときの備えを、先に話す", "status": "NOT_READY", "present": true, "today": "死んだあとの話より先に来ることがある。入院費や生活費を誰がどう出すのかを、親と話しておく。", "why": "", "deadline": null, "days": null, "dlsrc": "", "dlurl": "", "dlat": "", "blocked": ["書類の置き場所だけを聞く言い方"], "unlocks": [], "fact": "", "exc": "", "lost": "", "caution": "この話は『死』を持ち出さずに始められる。切り出しやすい入口になることがある。", "sb": ["", ""], "absent": null, "fog": false, "verif": "SELF_REVIEWED", "istoday": 0, "closed": false, "assumed": false, "closednote": "", "stream": "家族に切り出す"}};</script><div class="wrap" style="padding-top:0"><footer>これは、手続の順序と期限を示す地図です。個別の法律相談や税務相談ではありません。あなたの場合にどうなるかは、記載の相談先で確かめてください。制度は変わります。多くの項目は、まだ専門家の確認を受けていません。</footer></div><script>
const P=document.getElementById('panel'),B=document.getElementById('body');
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const SB={LAWYER:'弁護士',JUDICIAL_SCRIVENER:'司法書士',TAX_ACCOUNTANT:'税理士',
 ADMINISTRATIVE_SCRIVENER:'行政書士',LAND_SURVEYOR:'土地家屋調査士',
 INTERNATIONAL_LAWYER:'海外の弁護士',INTERNATIONAL_TAX_LAWYER:'国際税務の専門家'};
const ST={DONE:'済んだ',READY:'手をつけられる',IN_PROGRESS:'着手している',
 WAITING:'相手の返事を待っている',NOT_READY:'まだ開かない'};
const VF={SELF_REVIEWED:'まだ専門家の確認を受けていません',
 SOURCE_VERIFIED:'一次資料で確かめました',EXPERT_VERIFIED:'専門家の確認を受けました',
 DRAFT:'下書き'};
function show(id){
  const d=D[id];if(!d)return;
  let h='<h2>'+esc(d.title)+'</h2>';
  h+='<span class="tag">'+esc(d.stream)+'</span>';
  if(!d.closed)h+='<span class="tag">'+esc(d.present?(ST[d.status]||d.status):(d.fog?'まだ分からない':'通らない道'))+'</span>';
  if(d.istoday)h+='<span class="tag" style="background:#fdece4;color:#c2410c">今日決めること '+d.istoday+'</span>';
  if(d.closed)h+='<span class="tag">期間が過ぎている可能性</span>';
  if(d.verif)h+='<span class="tag">'+esc(VF[d.verif]||d.verif)+'</span>';
  if(!d.present){
    h+='<div class="note">'+esc(d.absent||'')+'</div>';
    if(d.fog)h+='<p class="why">これは「通らなくて済む」という意味ではありません。'
      +'まだうかがっていないので、決まっていないだけです。</p>';
    B.innerHTML=h;P.classList.remove('closed');return;}
  if(d.closed)h+='<div class="shut"><b>この期間は、もう動かせないかもしれません。</b><br>'
    +esc(d.closednote)+'</div>';
  if(d.fact)h+='<div class="band"><b>【事実】</b> '+esc(d.fact)+'<br><br><b>【ただし】</b> '+esc(d.exc)
    +(d.lost?'<br><br><span style="font-size:11.5px;color:#7a7364">失われるもの … '+esc(d.lost)+'</span>':'')+'</div>';
  h+='<dl>';
  h+='<dt>やること</dt><dd>'+esc(d.today)+'</dd>';
  if(d.assumed)h+='<div class="assumed"><b>この日数は、亡くなった日から数えたものです。</b><br>'
    +'この3か月は、ほんとうは「自分が相続人になったと知った日」から始まります。'
    +'相続人ごとに、別々に進みます。先の順位の人が放棄したためにあなたが相続人に'
    +'なったのなら、あなたの3か月は、それを知った日から始まります。'
    +'知った日が違えば、ここの日数も変わります。</div>';
  if(d.deadline)h+='<dt>期限</dt><dd>'+esc(d.deadline)
    +(d.days!=null&&d.days>=0?'（'+(d.assumed?'およそ ':'')+'あと '+d.days+' 日）':'')
    +(d.days!=null&&d.days<0&&!d.closed?'（'+(-d.days)+' 日過ぎています）':'')
    +(d.dlsrc?'<div class="src">確かめた先 … '+(d.dlurl
        ?'<a href="'+esc(d.dlurl)+'" target="_blank" rel="noopener">'+esc(d.dlsrc)+'</a>'
        :esc(d.dlsrc))+(d.dlat?'（'+esc(d.dlat)+' 確認）':'')+'</div>':'')
    +'</dd>';
  if(d.blocked&&d.blocked.length)h+='<dt>いま止まっている理由</dt><dd>「'+d.blocked.map(esc).join('」「')+'」が終わっていません</dd>';
  if(d.unlocks&&d.unlocks.length)h+='<dt>ここが済むと開きます</dt><dd>'+d.unlocks.map(esc).join('、')+'</dd>';
  if(d.why)h+='<dt>あなたにしかできない理由</dt><dd>'+esc(d.why)+'</dd>';
  if(d.sb[0])h+='<dt>相談するなら</dt><dd>'+esc(SB[d.sb[0]]||d.sb[0])+'<br>'+esc(d.sb[1])+'</dd>';
  h+='</dl>';
  if(d.caution)h+='<div class="note">※ '+esc(d.caution)+'</div>';
  B.innerHTML=h;P.classList.remove('closed');
}
document.querySelectorAll('.st,.chip').forEach(g=>{
  g.addEventListener('click',()=>show(g.dataset.id));
  g.addEventListener('keydown',e=>{if(e.key==='Enter')show(g.dataset.id);});
});
document.getElementById('x').addEventListener('click',()=>P.classList.add('closed'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')P.classList.add('closed');});
</script></body></html>
